name: veripatrol
description: A new Flutter project.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2

  http: ^1.2.0
  connectivity_plus: ^6.0.3
  permission_handler: ^11.3.1
  intl: ^0.18.1
  mobile_scanner: ^5.1.0
  geolocator: ^13.0.1
  path_provider: ^2.1.5
  path: ^1.8.3
  pdf: ^3.10.4
  printing: ^5.11.0
  google_fonts: ^6.1.0
  audioplayers: ^6.1.0
  vibration: ^2.0.1
  screenshot: ^3.0.0
  sqflite: ^2.2.8+4
  mailer: ^6.0.1
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/sounds/alert.mp3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/logo.png"