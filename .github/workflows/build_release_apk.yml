name: Build & Release APK

on:
  push:
    branches:
      - version_test
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_shorebird_release:
        description: 'Publish new base release to Shorebird'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK & Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Configure Flutter JDK for CI
        run: flutter config --jdk-dir "$JAVA_HOME"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Release with Shorebird (If requested)
        if: ${{ github.event.inputs.create_shorebird_release == 'true' || startsWith(github.ref, 'refs/tags/v') }}
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          shorebird release android --artifact apk

      - name: Build Standalone Release APK (Fallback/Standard)
        if: ${{ github.event.inputs.create_shorebird_release != 'true' && !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pentagon-patrol-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref_name == 'version_test' || github.ref_name == 'main'
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          tag_name: latest-apk
          name: "Pentagon Patrol - Guard Release APK"
          body: |
            Official Release APK for Pentagon Patrol Security Guards.
            - Built with Shorebird OTA Auto-Updates enabled.
            - Compatible with Android 13 Lite, Go Edition, and Android 7.0+.
            - Offline scanning and auto-sync support.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
