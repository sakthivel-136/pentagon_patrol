name: Build & Release APK

on:
  push:
    branches:
      - version_test
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_shorebird_release:
        description: 'Publish new base release to Shorebird'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK & Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Configure Flutter JDK for CI
        run: flutter config --jdk-dir "$JAVA_HOME"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Release with Shorebird (If requested)
        if: ${{ github.event.inputs.create_shorebird_release == 'true' || startsWith(github.ref, 'refs/tags/v') }}
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          shorebird release android --artifact apk

      - name: Build Standalone Release APK (Fallback/Standard)
        if: ${{ github.event.inputs.create_shorebird_release != 'true' && !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          flutter build apk --release

      - name: Generate Version Manifest
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -n1 | awk '{print $2}' | cut -d'+' -f1)
          BUILD_NUM=$(grep '^version:' pubspec.yaml | head -n1 | awk '{print $2}' | cut -d'+' -f2)
          if [ -z "$BUILD_NUM" ] || [ "$BUILD_NUM" = "$VERSION" ]; then
            BUILD_NUM="${{ github.run_number }}"
          fi

          mkdir -p build/app/outputs/flutter-apk
          cat <<EOF > build/app/outputs/flutter-apk/version.json
          {
            "version": "$VERSION",
            "build_number": $BUILD_NUM,
            "download_url": "https://github.com/sakthivel-136/pentagon_patrol/releases/download/latest-apk/app-release.apk",
            "release_notes": "Official release update with multi-factory rounds, offline caching, and bug fixes.",
            "updated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat build/app/outputs/flutter-apk/version.json

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pentagon-patrol-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Refresh latest-apk Tag & Clean Previous Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete existing release so GitHub creates a fresh one with current timestamp & source code zip
          gh release delete latest-apk --yes || true
          git tag -d latest-apk 2>/dev/null || true
          git push origin :refs/tags/latest-apk 2>/dev/null || true
          git tag -fa latest-apk -m "Release for commit ${{ github.sha }}"
          git push origin latest-apk --force

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref_name == 'version_test' || github.ref_name == 'main'
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/version.json
          tag_name: latest-apk
          target_commitish: ${{ github.sha }}
          name: "Pentagon Patrol - Guard Release APK"
          body: |
            Official Release APK for Pentagon Patrol Security Guards.
            - Direct In-App APK Auto-Updater enabled (Lifetime free, no expiring keys).
            - Compatible with Android 13 Lite, Go Edition, and Android 7.0+.
            - Dynamic multi-factory round slots and offline scan caching.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
